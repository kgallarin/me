name: Deploy to Lightsail

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, curl, mysql, zip, bcmath, gd, pdo
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Install Cloudflare Tunnel CLI on Runner
        run: |
          curl -L --output cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Deploy to server via SSH
        run: |
            mkdir -p ~/.ssh
            echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            
            export TUNNEL_EDGETLS_IP_VERSION=4
            
            ssh -v \
              -o UserKnownHostsFile=/dev/null \
              -o StrictHostKeyChecking=no \
              -o ProxyCommand="/usr/local/bin/cloudflared access ssh --hostname tunnel.kgallarin.com" \
              -i ~/.ssh/id_rsa \
              ${{ secrets.LIGHTSAIL_USER }}@tunnel.kgallarin.com \
              "set -e && cd /var/www/kgdev && git checkout -- package-lock.json && git pull origin main && composer install --no-dev --optimize-autoloader --no-interaction && php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan event:cache && sudo supervisorctl restart laravel-worker:*"