name: Deploy to Lightsail

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, curl, mysql, zip, bcmath, gd, pdo
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Set up Cloudflare Tunnel on Runner
        uses: cloudflare/cloudflared-action@master
        with:
          protocol: ctl

      - name: Configure SSH to use Cloudflare Tunnel
        run: |
          mkdir -p ~/.ssh
          echo "Host tunnel.kgallarin.com" >> ~/.ssh/config
          echo "  ProxyCommand cloudflared access ssh --hostname %h" >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: tunnel.kgallarin.com
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            set -e
            cd /var/www/kgdev

            git checkout -- package-lock.json
            git pull origin main

            composer install --no-dev --optimize-autoloader --